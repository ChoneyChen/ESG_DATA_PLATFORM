[project]
name = "esg-console"
version = "1.0.0"
description = "Console facade and safe operational projections"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.116,<1", "pydantic>=2.11,<3"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
