[project]
name = "esg-console"
version = "1.0.0"
description = "Console facade and safe operational projections"
requires-python = ">=3.11"
dependencies = ["esg-contracts>=2.1,<3", "fastapi>=0.116,<1", "pydantic>=2.11,<3"]

[project.optional-dependencies]
application = ["esg-workbench>=1.1,<2"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
