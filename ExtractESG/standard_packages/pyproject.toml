[project]
name = "extractesg-standard-packages"
version = "0.1.0"
description = "Versioned, portable ESG standard-package contracts and deterministic compiler."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
esg-standard-package = "esg_standard_packages.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
