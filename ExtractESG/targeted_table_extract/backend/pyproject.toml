[project]
name = "extractesg-targeted-table"
version = "0.6.0"
description = "Clause-driven extraction backbone with independent quantitative and qualitative data contracts."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "requests>=2.32,<3",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
models = [
  "Jinja2>=3.1,<4",
  "mlx-embeddings>=0.1,<0.2",
  "mlx-vlm>=0.6.16,<0.7",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[project.scripts]
esg-targeted = "esg_targeted.pipeline.worker:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../../extraction/src", "../../contracts/src", "../../shared_runtime/src"]

[tool.pytest.ini_options]
pythonpath = ["../../extraction/src", "../../contracts/src", "../../shared_runtime/src", "../../document_processing/src"]
testpaths = ["../../extraction/tests"]
