[project]
name = "esg-workbench"
version = "1.2.0"
description = "PDF evidence and raw extraction application"
requires-python = ">=3.11"
dependencies = ["esg-contracts>=2.1,<3", "esg-clauses>=1.2,<2", "esg-runtime>=1.2,<2", "fastapi>=0.116,<1", "pydantic>=2.11,<3", "requests>=2.32,<3", "uvicorn>=0.35,<1", "python-multipart>=0.0.9", "pdfplumber>=0.11", "Pillow>=10.3", "pypdfium2>=5.12.1,<6", "pypdf>=6,<7", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10", "jsonschema>=4.23,<5"]
models = ["mlx-vlm>=0.6.16,<0.7", "Jinja2>=3.1,<4"]

[project.scripts]
esg-document = "esg_document.cli:main"
esg-extraction = "esg_extraction.pipeline.worker:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["document/src", "pipeline/src", "extraction/src"]
namespaces = true

[tool.setuptools.package-data]
"esg_document.ocr" = ["*.swift"]

[tool.pytest.ini_options]
pythonpath = ["contracts/src", "shared_runtime/src", "document/src", "pipeline/src", "extraction/src", "../ClauseESG/src", "../ConsoleESG/backend/src"]
testpaths = ["document/tests", "extraction/tests"]
