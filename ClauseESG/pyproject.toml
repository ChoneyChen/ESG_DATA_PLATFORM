[project]
name = "esg-clauses"
version = "1.3.0"
description = "Independent, mutable clause contracts and lexical search plans"
requires-python = ">=3.11"
dependencies = ["esg-contracts>=2.2,<3", "pydantic>=2.11,<3"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
