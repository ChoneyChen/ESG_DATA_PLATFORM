<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlatESG · 数据审核</title>
<style>body{margin:0;background:#f4f7f8;color:#203743;font:15px/1.6 system-ui}main{max-width:1150px;margin:32px auto;padding:0 24px}h1{margin:0}a{color:#137d78}header{margin-bottom:24px}.panel{background:white;border:1px solid #d9e5e5;border-radius:12px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bacfce;border-radius:6px;font:inherit}textarea{height:140px}button{font:inherit;cursor:pointer;background:#137d78;color:white;border:0;border-radius:6px;padding:10px 16px;margin:8px 8px 8px 0}button.secondary{background:#dfeceb;color:#203743}.muted{color:#607578}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f4f7f8;padding:12px;max-height:360px;overflow:auto}.status{padding:10px;background:#e8f4f2}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #e3ecec}#detail[hidden]{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.panel{overflow:auto}}button:focus-visible{outline:3px solid #86c9c2}</style>
<main><header><a href="/">← 数据展示平台</a><h1>数据审核</h1><p class="muted">分别确认报告事实、条款映射和测量口径。全部条件完成后，系统自动检查并发布；原值与审核历史保留。</p></header>
<section class="panel"><div class="grid"><label>审核凭据<input id="token" type="password" autocomplete="off" placeholder="本地启动后读取 .local/review-token"></label><label>审核人<input id="operator" placeholder="请输入真实审核人标识"></label></div><button id="load">读取待审核数据</button><span id="message" role="status"></span></section>
<section class="panel"><table><thead><tr><th>主体 / 原编号</th><th>报告原值</th><th>事实 / 映射 / 发布</th><th>操作</th></tr></thead><tbody id="candidates"></tbody></table><p id="more" class="muted"></p></section>
<section id="detail" class="panel" hidden><h2 id="title"></h2><div id="state" class="status"></div><h3>原文证据</h3><div id="evidence"></div><details><summary>原始身份与映射说明</summary><pre id="identity"></pre></details>
<label>审核依据<textarea id="reason" placeholder="说明核对的原文、主体、期间与口径，或指出退回原因"></textarea></label>
<h3>1. 报告事实</h3><button id="fact-approve">批准事实</button><button class="secondary" id="fact-reject">退回事实</button>
<h3>2. 指标与条款映射</h3><div class="grid"><label>语义关系<select id="relation"><option value="">请选择</option><option value="exact">完全对应</option><option value="broader">披露范围更宽</option><option value="narrower">披露范围更窄</option><option value="partial">部分对应</option><option value="not_equivalent">不等价</option></select></label><label>支持程度<select id="satisfaction"><option value="">请选择</option><option value="supports">支持所选指标</option><option value="partially_supports">仅部分支持</option><option value="not_sufficient">证据不足</option><option value="not_applicable">不适用</option></select></label></div><button id="mapping-approve">保存映射审核</button><button class="secondary" id="mapping-reject">退回映射</button>
<h3>3. 主体与测量口径</h3><div class="grid"><label>已登记主体<select id="entity"></select></label><label>报告边界代码<input id="boundary" placeholder="依据报告确认边界，如 own_operations"></label><label>期间开始<input id="start" type="date"></label><label>期间结束<input id="end" type="date"></label><label>报告原单位（须核对）<input id="unit"></label><label>测量方法代码<input id="method" placeholder="明确披露后填写；未知留空"></label><label>值的性质<select id="role"><option value="actual">实际值</option><option value="context">方法等背景陈述</option></select></label></div><label>必要维度（JSON，值为已核对的规范代码）<textarea id="dimensions">{}</textarea></label><details><summary>指标定义、必要维度与比较条件</summary><pre id="contract"></pre></details><button id="context">批准测量口径</button><button class="secondary" id="refresh">刷新发布状态</button></section></main>
<script type="module">
const $=s=>document.querySelector(s);let rows=[],selected=null,entities=[],metrics=[];
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const message=text=>$('#message').textContent=text;
async function api(url,body){const result=await fetch(url,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+$('#token').value,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const data=await result.json();if(!result.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data;}
async function load(){try{const [c,e,m]=await Promise.all([api('/internal/v1/candidates'),api('/v1/entities'),api('/v1/metrics')]);rows=c.items;entities=e.items;metrics=m.items;$('#candidates').innerHTML=rows.map((r,i)=>`<tr><td>${esc(r.organization_ref)}<br><strong>${esc(r.source_datapoint_id)}</strong></td><td>${esc(r.raw_value_text??r.raw_disclosure_text)} ${esc(r.raw_unit)}</td><td>${esc(r.fact_review_status)} / ${esc(r.mapping_review_status)} / ${esc(r.publication_status??'待检查')}</td><td><button data-i="${i}">核对</button></td></tr>`).join('');$('#candidates').querySelectorAll('button').forEach(b=>b.onclick=()=>open(rows[Number(b.dataset.i)]));$('#more').textContent=rows.length>=200?'当前显示前200条；更多数据可通过审核API按主体筛选读取。':`共 ${rows.length} 条映射候选`;message('已读取');if(selected){const updated=rows.find(r=>r.mapping_id===selected.mapping_id);if(updated)open(updated);}}catch(e){message(e.message);}}
function open(row){selected=row;$('#detail').hidden=false;$('#title').textContent=row.source_datapoint_id+' · '+row.raw_indicator_name;$('#state').textContent=`事实 ${row.fact_review_status}；映射 ${row.mapping_review_status}；发布 ${row.publication_status??'尚未检查'}。${(row.reason_codes??[]).join('；')}`;$('#evidence').innerHTML=(row.sources??[]).map(s=>`<p>报告第 ${esc(s.page_number)} 页：${esc(s.source_quote)}</p>`).join('');$('#identity').textContent=JSON.stringify({source_identity:row.source_identity,mapping_reason:row.mapping_reason},null,2);$('#entity').innerHTML=entities.map(e=>`<option value="${esc(e.entity_ref)}">${esc(e.name_zh)} · ${esc(e.entity_kind)}</option>`).join('');$('#entity').value=row.context?.entity_ref??row.organization_ref;$('#start').value=(row.context?.period_start??row.period_start??'').slice(0,10);$('#end').value=(row.context?.period_end??row.period_end??'').slice(0,10);$('#unit').value=row.context?.reported_unit??row.raw_unit??'';$('#method').value=row.context?.measurement_method??'';$('#boundary').value=row.context?.boundary_code??'';$('#dimensions').value=JSON.stringify(row.context?.dimensions??{},null,2);$('#relation').value=row.mapping_relation;$('#satisfaction').value=row.satisfaction_status;const metric=metrics.find(m=>m.source_datapoint_id===row.source_datapoint_id);$('#role').value=row.context?.value_role??metric?.value_role??'actual';$('#contract').textContent=JSON.stringify(metric??{status:'当前平台主要清单未纳入本条款'},null,2);}
function reviewBase(){if(!selected)throw Error('请选择候选');if(!$('#operator').value.trim()||!$('#reason').value.trim())throw Error('请填写审核人和审核依据');return {operator_ref:$('#operator').value,reason:$('#reason').value};}
async function review(kind,decision){try{const body={...reviewBase(),[kind==='fact'?'disclosure_id':'mapping_id']:selected[kind==='fact'?'disclosure_id':'mapping_id'],decision};if(kind==='mapping'&&decision==='approved'){body.mapping_relation=$('#relation').value;body.satisfaction_status=$('#satisfaction').value;}await api('/internal/v1/reviews',body);message('审核已保存；发布条件正在检查。可刷新状态。');}catch(e){message(e.message);}}
$('#load').onclick=load;$('#refresh').onclick=load;$('#fact-approve').onclick=()=>review('fact','approved');$('#fact-reject').onclick=()=>review('fact','rejected');$('#mapping-approve').onclick=()=>review('mapping','approved');$('#mapping-reject').onclick=()=>review('mapping','rejected');$('#context').onclick=async()=>{try{await api('/internal/v1/measurement-contexts',{...reviewBase(),mapping_id:selected.mapping_id,entity_ref:$('#entity').value,period_start:$('#start').value,period_end:$('#end').value,boundary_code:$('#boundary').value,value_role:$('#role').value,measurement_method:$('#method').value||null,reported_unit:$('#unit').value||null,dimensions:JSON.parse($('#dimensions').value)});message('测量口径已保存；符合条件后自动发布。');}catch(e){message(e.message);}};
</script></html>
